name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # perlu untuk membuat/memperbarui GitHub Release

concurrency:
  group: apk-release
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # perlu riwayat penuh untuk menghitung nomor build

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          accept-android-sdk-licenses: true
          packages: ''

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install npm dependencies
        run: npm install

      - name: Apply custom app icon
        run: |
          cp -r android-icon-assets/mipmap-* android/app/src/main/res/
          mkdir -p android/app/src/main/res/values
          cp android-icon-assets/values/ic_launcher_background.xml android/app/src/main/res/values/
          
      - name: Sync Capacitor
        run: npx cap sync android


      - name: Patch AndroidManifest for file picker stability
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          # 1. Request large heap — Android less likely to kill process
          #    while file picker Activity is open in foreground
          sed -i 's/android:allowBackup="true"/android:allowBackup="true" android:largeHeap="true"/' "$MANIFEST"

          # 2. Expand configChanges — prevent Activity recreation when
          #    density or fontScale changes during file picker transition
          sed -i 's/orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode/orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode|fontScale|density/' "$MANIFEST"

          echo "=== AndroidManifest patches applied ==="
          grep -E "largeHeap|configChanges" "$MANIFEST"

      - name: Decode release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Configure release signing
        run: |
          cat >> android/app/build.gradle << 'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Set app version from commit count
        run: |
          BUILD=$(git rev-list --count HEAD)
          sed -i "s/versionCode [0-9][0-9]*/versionCode $BUILD/; s/versionName \"[^\"]*\"/versionName \"1.0.$BUILD\"/" android/app/build.gradle
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          grep -E "versionCode|versionName" android/app/build.gradle
          grep -q "versionCode $BUILD" android/app/build.gradle

      - name: Grant Gradle permission
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=512m"
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Rename APK
        run: |
          DATE=$(date +'%Y%m%d-%H%M')
          mv android/app/build/outputs/apk/release/app-release.apk \
             android/app/build/outputs/apk/release/exambre-$DATE.apk
          echo "APK_NAME=exambre-$DATE" >> $GITHUB_ENV

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Publish rolling release (apk-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          PAGE_URL="https://${OWNER_LC}.github.io/${REPO_NAME}/download/"
          VERSION="1.0.${BUILD}"

          # Jangan timpa rilis yang lebih baru (build bisa selesai tidak berurutan)
          CUR=$(gh release view apk-latest --json body -q .body 2>/dev/null | sed -n 's/^build:[[:space:]]*\([0-9][0-9]*\).*/\1/p' | head -1 || true)
          CUR=${CUR:-0}
          if [ "$CUR" -ge "$BUILD" ]; then
            echo "Rilis saat ini (build $CUR) >= build ini ($BUILD); dilewati."
            exit 0
          fi

          mkdir -p release
          cp android/app/build/outputs/apk/release/*.apk release/exambre.apk
          MSG=$(git log -1 --pretty=%s)
          {
            echo "build: ${BUILD}"
            echo "version: ${VERSION}"
            echo "page: ${PAGE_URL}"
            echo "commit: ${GITHUB_SHA:0:7}"
            echo
            echo "${MSG}"
          } > release/notes.md

          # Pindahkan tag ke commit ini supaya rilis menunjuk kode yang benar
          git tag -f apk-latest "$GITHUB_SHA"
          git push -f origin refs/tags/apk-latest

          if gh release view apk-latest >/dev/null 2>&1; then
            gh release upload apk-latest release/exambre.apk --clobber
            gh release edit apk-latest --title "Exambre v${VERSION}" --notes-file release/notes.md --latest
          else
            gh release create apk-latest release/exambre.apk --title "Exambre v${VERSION}" --notes-file release/notes.md --target "$GITHUB_SHA" --latest
          fi
          echo "Link tetap: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/exambre.apk"
