name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          accept-android-sdk-licenses: true

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install npm dependencies
        run: npm install

      - name: Apply custom app icon
        run: |
          cp -r android-icon-assets/mipmap-* android/app/src/main/res/
          mkdir -p android/app/src/main/res/values
          cp android-icon-assets/values/ic_launcher_background.xml android/app/src/main/res/values/
          
      - name: Sync Capacitor
        run: npx cap sync android


      - name: Patch AndroidManifest for file picker stability
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          # 1. Request large heap — Android less likely to kill process
          #    while file picker Activity is open in foreground
          sed -i 's/android:allowBackup="true"/android:allowBackup="true" android:largeHeap="true"/' "$MANIFEST"

          # 2. Expand configChanges — prevent Activity recreation when
          #    density or fontScale changes during file picker transition
          sed -i 's/orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode/orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode|fontScale|density/' "$MANIFEST"

          echo "=== AndroidManifest patches applied ==="
          grep -E "largeHeap|configChanges" "$MANIFEST"

      - name: Decode release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Configure release signing
        run: |
          cat >> android/app/build.gradle << 'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Grant Gradle permission
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=512m"
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Rename APK
        run: |
          DATE=$(date +'%Y%m%d-%H%M')
          mv android/app/build/outputs/apk/release/app-release.apk \
             android/app/build/outputs/apk/release/exambre-$DATE.apk
          echo "APK_NAME=exambre-$DATE" >> $GITHUB_ENV

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
